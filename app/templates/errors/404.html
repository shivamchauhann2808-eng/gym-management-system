{% extends "base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="glass-card p-5 text-center" style="max-width: 500px;">
        <div class="text-warning fs-1 mb-4">
            <i class="bi bi-question-circle-fill"></i>
        </div>
        <h2 class="text-white font-weight-bold mb-3">404 - Page Not Found</h2>
        <p class="text-secondary mb-4">
            The page you are looking for does not exist, has been removed, or is temporarily unavailable.
        </p>
        <a href="/" class="btn btn-orange px-4 py-2">
            <i class="bi bi-house me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
