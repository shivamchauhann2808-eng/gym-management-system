{% extends "base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="glass-card p-5 text-center" style="max-width: 500px;">
        <div class="text-danger fs-1 mb-4">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h2 class="text-white font-weight-bold mb-3">500 - Internal Server Error</h2>
        <p class="text-secondary mb-4">
            The server encountered an unexpected error and was unable to complete your request. Please try again later.
        </p>
        <a href="/" class="btn btn-orange px-4 py-2">
            <i class="bi bi-house me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
